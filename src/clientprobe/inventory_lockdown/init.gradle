// Isolated CLIENT validation; the probe never enters production artifacts.
allprojects {
    afterEvaluate {
        def probeSource = project.file('src/clientprobe/inventory_lockdown')
        def probeOutput = project.file('build/inventory-lockdown-client-probe')
        tasks.register('compileInventoryLockdownProbe', JavaCompile) {
            dependsOn tasks.named('classes')
            source fileTree(new File(probeSource, 'java')) { include '**/*.java' }
            classpath = sourceSets.main.compileClasspath + sourceSets.main.output
            destinationDirectory = new File(probeOutput, 'classes')
            options.encoding = 'UTF-8'
            options.release = 21
            options.compilerArgs += ['-proc:none']
        }
        tasks.register('inventoryLockdownProbeJar', Jar) {
            dependsOn tasks.named('compileInventoryLockdownProbe')
            from new File(probeOutput, 'classes')
            from new File(probeSource, 'resources')
            archiveFileName = 'probe.jar'
            destinationDirectory = probeOutput
        }
        loom.runs.client {
            runDir 'build/inventory-lockdown-client-probe/run'
            vmArg "-Dfabric.addMods=${new File(probeOutput, 'probe.jar').absolutePath}"
        }
        tasks.named('runClient') { dependsOn tasks.named('inventoryLockdownProbeJar') }
    }
}
