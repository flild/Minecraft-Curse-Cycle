// Isolated CLIENT validation, excluded from production source sets and artifacts.
allprojects {
    afterEvaluate {
        def probeSource = project.file('src/clientprobe/no_block_placing')
        def probeOutput = project.file('build/no-block-placing-review-client-probe')
        tasks.register('compileNoBlockPlacingProbe', JavaCompile) {
            dependsOn tasks.named('classes')
            source fileTree(new File(probeSource, 'java')) { include '**/*.java' }
            classpath = sourceSets.main.compileClasspath + sourceSets.main.output
            destinationDirectory = new File(probeOutput, 'classes')
            options.encoding = 'UTF-8'
            options.release = 21
            options.compilerArgs += ['-proc:none']
        }
        tasks.register('noBlockPlacingProbeJar', Jar) {
            dependsOn tasks.named('compileNoBlockPlacingProbe')
            from new File(probeOutput, 'classes')
            from new File(probeSource, 'resources')
            archiveFileName = 'probe.jar'
            destinationDirectory = probeOutput
        }
        loom.runs.client {
            runDir 'build/no-block-placing-review-client-probe/run'
            vmArg "-Dfabric.addMods=${new File(probeOutput, 'probe.jar').absolutePath}"
        }
        tasks.named('runClient') { dependsOn tasks.named('noBlockPlacingProbeJar') }
    }
}
